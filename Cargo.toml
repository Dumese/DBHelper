[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/utils",
    "crates/core",
    "crates/drivers/rel_common",
    "crates/drivers/driver-sqlite",
    "crates/drivers/driver-mysql",
    "crates/drivers/driver-postgres",
    "crates/drivers/driver-mssql",
    "crates/drivers/driver-oracle",
    "crates/drivers/driver-redis",
    "crates/drivers/driver-mongodb",
    "crates/drivers/driver-elasticsearch",
    "crates/ui",
    "crates/app",
    "installer",
    "tests",
]

[workspace.package]
version = "2.4.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# ---- 内部 crate ----
dbhelper-models = { path = "crates/models" }
dbhelper-utils = { path = "crates/utils" }
dbhelper-core = { path = "crates/core" }
dbhelper-ui = { path = "crates/ui" }
rel-common = { path = "crates/drivers/rel_common" }
driver-sqlite = { path = "crates/drivers/driver-sqlite" }
driver-mysql = { path = "crates/drivers/driver-mysql" }
driver-postgres = { path = "crates/drivers/driver-postgres" }
driver-mssql = { path = "crates/drivers/driver-mssql" }
driver-oracle = { path = "crates/drivers/driver-oracle" }
driver-redis = { path = "crates/drivers/driver-redis" }
driver-mongodb = { path = "crates/drivers/driver-mongodb" }
driver-elasticsearch = { path = "crates/drivers/driver-elasticsearch" }

# ---- 基础设施 ----
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sysinfo = "0.33"
once_cell = "1"
bytemuck = "1"

# ---- 安全 / Vault ----
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

# ---- 数据库驱动 ----
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "mysql", "postgres", "bigdecimal", "chrono", "json"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
oracle = "0.6"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
mongodb = "2.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---- 导入导出 ----
csv = "1"
calamine = "0.31"
rust_xlsxwriter = "0.79"
quick-xml = "0.37"

futures-util = "0.3"

bson = "2"

urlencoding = "2"

# ---- UI ----
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "tokio", "advanced", "svg", "image", "crisp", "lazy"] }
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1
